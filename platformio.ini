; PlatformIO Project Configuration File
; LilyGO T-01C3 / ESP32-C3 - Landis+Gyr T550 Heat Meter Gateway (ESP-IDF)

[platformio]
default_envs = esp32-c3

[env:esp32-c3]
platform = espressif32 @ 6.9.0
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = dio
board_build.f_flash = 40000000L
board_build.cmake_extra_args = 
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32c3"
extra_scripts = post:scripts/merge_bin.py
build_flags =
    -DDEFAULT_GITHUB_REPO=\"VertoMomentum/ESP32_HeatMeterGateway\"

[env:esp32-s3]
platform = espressif32 @ 6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_build.cmake_extra_args = 
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.defaults.esp32s3"
extra_scripts = post:scripts/merge_bin.py
build_flags =
    -DIR_RX_PIN=18
    -DIR_TX_PIN=17
    -DDEFAULT_GITHUB_REPO=\"VertoMomentum/ESP32_HeatMeterGateway\"

[env:native]
platform = native
test_framework = unity
test_testing_command =
    python3
    scripts/generate_coverage.py
    --run-test
    ${platformio.build_dir}/${this.__env__}/program
build_flags = 
    -std=gnu++17
    -O0
    --coverage
    -lgcov
    -DUNIT_TEST
    -DUNITY_INCLUDE_DOUBLE
    -Iinclude
    -Itest/mocks